name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: gh-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Process
        env:
          AE83B4: ${{ secrets.AE83B4 }}
          B6AF1F: ${{ secrets.B6AF1F }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('AE83B4', '')
          env_b = os.environ.get('B6AF1F', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- b7579bd30829839e798c -->', env_a)
          if env_b:
              result = result.replace('<!-- 985218de02d84541942c5e33561b74735e13663f99889146 -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
